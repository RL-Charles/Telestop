; ─────────────────────────────────────────────────────────
; Teleblock — Asterisk Manager Interface (manager.conf)
; AMI binds to loopback only — never expose to WAN.
; Used by scripts/verify.py for health checks.
; ─────────────────────────────────────────────────────────

[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1
; Timeout idle AMI sessions after 30s
displayconnects = no

[teleblock]
; AMI account for health checks and the FastAGI service.
; Password is loaded from the host .env; placeholder here.
; Set AMI_SECRET in .env to match this value.
secret = changeme
read = system,call,log,verbose,agent,command,reporting,originate
write = system,call,log,verbose,agent,command,reporting,originate
deny = 0.0.0.0/0.0.0.0
; Allow only loopback connections
permit = 127.0.0.1/255.255.255.0
