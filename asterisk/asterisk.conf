; ─────────────────────────────────────────────────────────
; Teleblock — Asterisk Main Configuration (asterisk.conf)
; Passed to Asterisk via: asterisk -C /etc/asterisk/teleblock/asterisk.conf
; All relative config paths resolve from astetcdir below.
; ─────────────────────────────────────────────────────────

[directories]
astetcdir => /etc/asterisk/teleblock
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 3
debug = 0
; Real-time scheduling — critical for audio quality on Pi 5
rtprio = 50
maxcalls = 10
; Disable the built-in HTTP server (not needed)
http_enabled = no
