; ─────────────────────────────────────────────────────────
; Teleblock — Asterisk Module Load List (modules.conf)
; Use autoload=yes and selectively noload what's not needed.
; This is more robust than trying to explicitly list every module.
; ─────────────────────────────────────────────────────────

[modules]
autoload = yes

; ── Disable modules we definitely don't need ─────────────
; (saves memory and startup time on Pi 5)
noload = chan_dahdi.so
noload = chan_mgcp.so
noload = chan_skinny.so
noload = chan_unistim.so
noload = chan_iax2.so
noload = res_adsi.so
noload = app_adsiprog.so
noload = app_getcpeid.so
noload = app_voicemail.so
noload = app_minivm.so
noload = app_queue.so
noload = app_festival.so
noload = app_mp3.so
noload = cdr_pgsql.so
noload = res_cdr_pgsql.so
noload = cdr_mysql.so
noload = cdr_odbc.so
noload = res_config_pgsql.so
noload = res_config_mysql.so
; Both FXO and FXS are on the same HT813 — native RTP bridge causes the
; HT813 to route RTP to itself, producing silence. Force software bridge.
noload = bridge_native_rtp.so
noload = res_config_odbc.so
noload = res_odbc.so
noload = res_fax.so
noload = res_calendar.so
noload = res_jabber.so
noload = chan_motif.so
noload = res_xmpp.so
noload = res_hep.so
noload = res_hep_rtcp.so
noload = res_phoneprov.so
noload = res_http_websocket.so
; Disable extra codecs — G.711 only
noload = codec_opus.so
noload = codec_silk.so
noload = codec_g722.so
noload = codec_g726.so
noload = codec_g729a.so
noload = codec_ilbc.so
noload = codec_lpc10.so
noload = codec_speex.so
noload = codec_gsm.so

; ── ARI / Stasis (not used) ──────────────────────────────
noload = res_ari.so
noload = res_ari_applications.so
noload = res_ari_asterisk.so
noload = res_ari_bridges.so
noload = res_ari_channels.so
noload = res_ari_device_states.so
noload = res_ari_endpoints.so
noload = res_ari_events.so
noload = res_ari_playbacks.so
noload = res_ari_recordings.so
noload = res_ari_sounds.so
noload = app_stasis.so

; ── WebSocket / AEAP (not used) ──────────────────────────
noload = res_websocket_client.so
noload = res_aeap.so
noload = res_speech_aeap.so
noload = chan_websocket.so
noload = res_pjsip_transport_websocket.so

; ── CDR/CEL backends without config ──────────────────────
noload = cdr_csv.so
noload = cdr_custom.so
noload = cdr_manager.so
noload = cdr_sqlite3_custom.so
noload = cel_custom.so
noload = cel_sqlite3_custom.so
noload = cel_manager.so

; ── Misc unused / missing-dependency modules ─────────────
noload = res_stun_monitor.so
noload = res_hep_pjsip.so
noload = res_pjsip_phoneprov_provider.so
noload = res_pjsip_notify.so
noload = app_agent_pool.so
noload = res_parking.so
noload = app_confbridge.so
noload = app_page.so
noload = app_alarmreceiver.so
noload = app_followme.so
noload = app_amd.so
noload = res_prometheus.so
noload = pbx_ael.so
noload = pbx_dundi.so
; Modules that require config files we don't ship (use stubs or don't need them)
noload = res_config_sqlite3.so
noload = res_statsd.so
noload = res_pjsip_config_wizard.so
noload = res_smdi.so
noload = res_clialiases.so
