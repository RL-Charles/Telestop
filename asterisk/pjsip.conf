; ─────────────────────────────────────────────────────────
; Teleblock — Asterisk PJSIP Configuration (pjsip.conf)
; SIP trunk to Grandstream HT813 FXO port
; ─────────────────────────────────────────────────────────
; HT813 IP: 192.168.42.145  (static, direct eth0 link)
; Credentials must match the HT813 web UI SIP account settings.
; ─────────────────────────────────────────────────────────

; ── Transport ───────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=192.168.42.1:5060
local_net=192.168.42.0/24

; ── HT813 FXO Auth ──────────────────────────────────────
[ht813-fxo-auth]
type=auth
auth_type=userpass
username=ht813-fxo         ; must match HT813 SIP User ID
password=change-me

; ── HT813 FXO AOR (Address of Record) ───────────────────
[ht813-fxo]
type=aor
; HT813 uses direct-IP peering with SIP Registration disabled.
contact=sip:ht813-fxo@192.168.42.145:5062
qualify_frequency=30

; ── HT813 FXO Endpoint ──────────────────────────────────
[ht813-fxo]
type=endpoint
context=from-pstn                ; inbound calls land here
disallow=all
allow=ulaw                  ; G.711 u-law only — no G.729
dtmf_mode=rfc4733           ; RFC 4733 / RFC 2833 RTP events
from_user=ht813-fxo
auth=ht813-fxo-auth
outbound_auth=ht813-fxo-auth ; auth credentials for outbound INVITEs (handles HT813 401 challenge)
aors=ht813-fxo
direct_media=no             ; force media through Pi (required for AGI audio)
rtp_symmetric=yes
force_rport=yes
ice_support=no
trust_id_inbound=yes        ; trust P-Asserted-Identity from HT813 for real PSTN caller ID

; ── Identify (match inbound from HT813 IP) ───────────────
; FXO port talks on 5062, FXS port talks on 5060 — scope each separately
[ht813-fxo-identify]
type=identify
endpoint=ht813-fxo
match=192.168.42.145:5062

; ── HT813 FXS identify ──────────────────────────────────
[house-phone-identify]
type=identify
endpoint=house-phone
match=192.168.42.145:5060

; ── HT813 FXS (analogue house phone) ────────────────────
; TODO: Set username/password to match the HT813 FXS SIP account
;       configured in the HT813 web UI → FXS Port → SIP Account.
[house-phone]
type=aor
; HT813 uses direct-IP peering with SIP Registration disabled.
contact=sip:house-phone@192.168.42.145:5060
qualify_frequency=30

[house-phone-auth]
type=auth
auth_type=userpass
username=house-phone        ; match HT813 FXS SIP User ID
password=change-me

[house-phone]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
dtmf_mode=rfc4733
auth=house-phone-auth
aors=house-phone
direct_media=no
rtp_symmetric=yes
force_rport=yes
