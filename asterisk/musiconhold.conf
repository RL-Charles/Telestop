; ─────────────────────────────────────────────────────────
; Teleblock — Music on Hold Configuration
; ─────────────────────────────────────────────────────────

; US ringback tone (440+480 Hz, 2s on / 4s off)
; Used by Dial(PJSIP/house-phone,30,gm(ringback)) so the
; caller hears proper ringing while the house phone rings.
[ringback]
mode=files
directory=/var/lib/asterisk/moh/ringback
sort=alpha
format=ulaw
