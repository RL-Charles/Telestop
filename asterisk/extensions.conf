; ─────────────────────────────────────────────────────────
; Teleblock — Asterisk Dialplan (extensions.conf)
; ─────────────────────────────────────────────────────────
; Inbound PSTN calls arrive from the Grandstream HT813 FXO
; port via SIP.  The FastAGI challenge script decides whether
; to pass or block the call.
; ─────────────────────────────────────────────────────────

[general]
static=yes
writeprotect=no

; ── Inbound from HT813 FXO ──────────────────────────────
[from-pstn]
; Limit to one concurrent inbound call (HT813 FXO limitation)
exten => s,1,Set(GROUP(inbound)=pstn)
 same => n,GotoIf($[${GROUP_COUNT(inbound@pstn)} > 1]?busy)

 ; Set language and answer the call
 same => n,Set(CHANNEL(language)=en)
 same => n,Answer()
 same => n,Wait(1)

 ; Pre-check: ask the AGI if this caller is already trusted (DB lookup only,
 ; no digit-waiting, so no FD race).  AGI sets IS_TRUSTED=1 if trusted.
 same => n,AGI(agi://127.0.0.1:4573,check_trusted)
 same => n,GotoIf($["${IS_TRUSTED}" = "1"]?trusted_pass)

 ; Not trusted — play challenge and collect one DTMF digit via dialplan Read().
 ; Read() is immune to the ast_waitfordigit_full FD race that hits AGI commands.
 ; Read(var, file, maxdigits, option, attempts, timeout_seconds)
 same => n,Read(DTMF_DIGIT,teleblock/challenge,1,,1,8)

 ; Routing and result-setting in pure dialplan — no channel FD polling in AGI.
 same => n,GotoIf($["${DTMF_DIGIT}" = "1"]?passcall)
 same => n,GotoIf($["${DTMF_DIGIT}" = ""]?settimeout)
 same => n,Set(CHALLENGE_RESULT=FAIL)
 same => n,AGI(agi://127.0.0.1:4573,log_result,${CHALLENGE_RESULT})
 same => n,Goto(block,s,1)

 same => n(settimeout),Set(CHALLENGE_RESULT=TIMEOUT)
 same => n,AGI(agi://127.0.0.1:4573,log_result,${CHALLENGE_RESULT})
 same => n,Goto(block,s,1)

 same => n(passcall),Set(CHALLENGE_RESULT=PASS)
 same => n,AGI(agi://127.0.0.1:4573,log_result,${CHALLENGE_RESULT})
 same => n,Goto(allow,s,1)

 ; Trusted caller — skip challenge, log PASS, connect
 same => n(trusted_pass),Set(CHALLENGE_RESULT=PASS)
 same => n,AGI(agi://127.0.0.1:4573,log_result,${CHALLENGE_RESULT})
 same => n,Goto(allow,s,1)

; Busy — second call while one is active
exten => s,n(busy),Busy(10)
 same => n,Hangup()


; ── Call passed the challenge ────────────────────────────
[allow]
exten => s,1,NoOp(Call PASSED — connecting to house phone)
 ; Dial the analogue phone via the HT813 FXS port
 ; r = generate in-band ringback to caller while house phone rings
 same => n,Dial(PJSIP/house-phone,30,gr)
 same => n,Hangup()


; ── Call failed or timed out ─────────────────────────────
[block]
exten => s,1,NoOp(Call BLOCKED — result=${CHALLENGE_RESULT})
 same => n,Playback(teleblock/blocked)
 same => n,Hangup()


; ── Outbound from house phone ────────────────────────────
; Called when the HT813 FXS port (house-phone endpoint) dials any number.
; Correct PJSIP trunk dial format: PJSIP/${EXTEN}@endpoint
;   (PJSIP/endpoint/${EXTEN} passes the number as a raw URI — invalid)
; Pattern _[0-9*#+a-zA-Z]. covers digits, *, #, +, letters — everything needed
; for outbound.  Avoids the Asterisk "use of '_.' is strongly discouraged" warning.
; No challenge, no blocklist, no filtering — outbound is completely unrestricted.
[from-internal]
; Explicit h (hangup) handler — keeps pattern from swallowing the hangup context
exten => h,1,Hangup()

exten => _[0-9*#+a-zA-Z].,1,NoOp(Outbound call: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@ht813-fxo,60,r)
 same => n,Hangup()


; ══════════════════════════════════════════════════════════
; PASSTHROUGH TEST CONTEXT — no AGI challenge, no blocking.
; Use this to verify Asterisk ↔ HT813 ↔ house-phone path
; before enabling the full challenge flow.
;
; To activate: temporarily set context=from-pstn-test in
; the [ht813-fxo] endpoint above, then reload:
;   docker exec asterisk asterisk -rx "module reload res_pjsip.so"
;   docker exec asterisk asterisk -rx "dialplan reload"
;
; Remove or comment out this context once passthrough is confirmed.
; ══════════════════════════════════════════════════════════
[from-pstn-test]
exten => s,1,NoOp(PASSTHROUGH TEST — CID=${CALLERID(num)} no challenge active)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Dial(PJSIP/house-phone,30,g)
 same => n,Hangup()
