; ─────────────────────────────────────────────────────────
; Teleblock — Asterisk Logger Configuration (logger.conf)
; ─────────────────────────────────────────────────────────

[general]
; ISO 8601 timestamps in all log output
dateformat=%F %T

; Disable the queue_log file — we don't use call queues and the
; host bind-mount of /var/log/asterisk may not be writable by the
; asterisk user.  Queue events are irrelevant for Teleblock.
queue_log = no

[logfiles]
; Write to the Docker console only (captured by `docker compose logs`).
; No file log — /var/log/teleblock is a host bind-mount owned by root and is
; reserved for the AGI service.  The asterisk user cannot write there.
console => notice,warning,error,verbose,dtmf
